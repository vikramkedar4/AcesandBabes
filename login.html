<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log in — Aces & Babes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>
</head>
<body class="auth-body">

<div class="auth-card">
  <a href="index.html" class="back">← Back to home</a>
  <a class="logo" href="index.html">Aces <span>&</span> Babes</a>
  <p class="tagline">Welcome back</p>
  <div class="rule rule-center"></div>

  <div id="msg" class="msg hidden" role="alert"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" placeholder="you@email.com" required/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required/>
    </div>
    <button class="btn btn-block" id="loginBtn" type="submit">Enter the arena</button>
  </form>

  <p class="auth-foot">No account yet? <a href="signup.html">Sign up free</a></p>
</div>

<script>
(async function () {
  if (!window.AB) {
    document.querySelector('.auth-card').insertAdjacentHTML('afterbegin',
      '<div class="msg msg-error">Could not load the sign-in library. Check your connection and reload.</div>');
    return;
  }
  if (await AB.redirectIfAuthed()) return;

  var form = AB.$('loginForm');
  var btn = AB.$('loginBtn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = AB.$('email').value.trim();
    var password = AB.$('password').value;
    if (!email || !password) return AB.showMsg('msg', 'Enter your email and password.', 'error');

    btn.disabled = true;
    btn.textContent = 'Logging in…';
    AB.hideMsg('msg');

    var res = await AB.db.auth.signInWithPassword({ email: email, password: password });
    if (res.error) {
      btn.disabled = false;
      btn.textContent = 'Enter the arena';
      return AB.showMsg('msg', AB.friendlyError(res.error), 'error', true);
    }
    window.location.replace('dashboard.html');
  });
})();
</script>
</body>
</html>
