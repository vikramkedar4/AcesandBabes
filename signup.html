<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign up — Aces & Babes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>
</head>
<body class="auth-body">

<div class="auth-card">
  <a href="index.html" class="back">← Back to home</a>
  <a class="logo" href="index.html">Aces <span>&</span> Babes</a>
  <p class="tagline">Create your account</p>
  <div class="rule rule-center"></div>

  <div id="msg" class="msg hidden" role="alert"></div>

  <form id="signupForm" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" placeholder="yourname" maxlength="20" spellcheck="false" required/>
      <div class="help">3–20 characters, letters, numbers and underscores. Your partner uses this to invite you.</div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" placeholder="you@email.com" required/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required/>
    </div>
    <button class="btn btn-block" id="signupBtn" type="submit">Join the game</button>
  </form>

  <p class="auth-foot" id="foot">Already have an account? <a href="login.html">Log in</a></p>
</div>

<script>
(async function () {
  if (!window.AB) {
    document.querySelector('.auth-card').insertAdjacentHTML('afterbegin',
      '<div class="msg msg-error">Could not load the sign-up library. Check your connection and reload.</div>');
    return;
  }
  if (await AB.redirectIfAuthed()) return;

  var form = AB.$('signupForm');
  var btn = AB.$('signupBtn');

  function reset(label) { btn.disabled = false; btn.textContent = label || 'Join the game'; }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = AB.$('username').value.trim().toLowerCase();
    var email = AB.$('email').value.trim();
    var password = AB.$('password').value;

    if (!username || !email || !password) return AB.showMsg('msg', 'All fields are required.', 'error');
    if (!/^[a-z0-9_]{3,20}$/.test(username)) return AB.showMsg('msg', 'Username must be 3–20 characters: letters, numbers and underscores only.', 'error');
    if (email.indexOf('@') < 1) return AB.showMsg('msg', 'Enter a valid email address.', 'error');
    if (password.length < 6) return AB.showMsg('msg', 'Password must be at least 6 characters.', 'error');

    btn.disabled = true;
    btn.textContent = 'Creating account…';
    AB.hideMsg('msg');

    // 1. Is the username free? (profiles are publicly readable)
    var taken = await AB.db.from('profiles').select('id').ilike('username', username).maybeSingle();
    if (taken.error) { reset(); return AB.showMsg('msg', AB.friendlyError(taken.error), 'error', true); }
    if (taken.data) { reset(); return AB.showMsg('msg', '@' + username + ' is already taken. Pick another.', 'error', true); }

    // 2. Create the auth user. The username rides along in metadata so the
    //    database trigger can create the profile even if email confirmation
    //    is required and we never get a session here.
    var res = await AB.db.auth.signUp({
      email: email,
      password: password,
      options: { data: { username: username } }
    });
    if (res.error) { reset(); return AB.showMsg('msg', AB.friendlyError(res.error), 'error', true); }

    var user = res.data.user;
    if (user && Array.isArray(user.identities) && user.identities.length === 0) {
      reset();
      return AB.showMsg('msg', 'An account with this email already exists. Log in instead.', 'error', true);
    }

    if (res.data.session) {
      // Email confirmation is off: we are signed in. Make sure the profile
      // row exists (the trigger normally creates it) and go.
      await AB.db.from('profiles')
        .upsert({ id: user.id, username: username, full_name: username }, { onConflict: 'id', ignoreDuplicates: true });
      window.location.replace('dashboard.html');
      return;
    }

    // Email confirmation is on: tell them what to do next.
    form.classList.add('hidden');
    AB.showMsg('msg', 'Almost there. We sent a confirmation link to ' + email + '. Click it, then log in.', 'success', true);
    AB.$('foot').innerHTML = '<a href="login.html" class="btn btn-block">Go to log in</a>';
  });
})();
</script>
</body>
</html>
